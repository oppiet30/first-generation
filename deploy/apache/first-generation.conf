# Fedora Apache + the existing /etc/httpd/conf.d/php.conf PHP-FPM handler.
# Install only after the application and private .env are prepared.
<VirtualHost *:80>
    ServerName first-generation.local
    DocumentRoot "/var/www/first-generation/public"

    ErrorLog logs/first-generation_error.log
    CustomLog logs/first-generation_access.log combined

    <Directory "/var/www/first-generation/public">
        Options -Indexes -MultiViews
        AllowOverride None
        DirectoryIndex index.html
        Require ip 127.0.0.1 ::1 10.1.10.0/24

        # Used only by php -S; Apache serves the page/API directly.
        <Files "router.php">
            Require all denied
        </Files>
    </Directory>
</VirtualHost>

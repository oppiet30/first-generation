name: Foundation tests
on:
  push:
    branches: [main, feature/mortality-survival]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: first_generation
          MARIADB_USER: fg_app
          MARIADB_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: first_generation
      DB_USER: fg_app
      DB_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v6
      - name: Install PHP and MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql mariadb-client composer
      - name: PHP syntax
        run: find app bin public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Dashboard JavaScript syntax
        run: |
          node --check public/assets/dashboard.js
          node --check public/assets/family-tree.js
      - name: Dashboard response handling
        run: node --test tests/DashboardTest.cjs tests/FamilyTreePageTest.cjs
      - name: Large dashboard memory regression
        run: |
          php tests/StatisticsAncestryTest.php
          php -d memory_limit=128M tests/StatisticsMemoryTest.php
          php -d memory_limit=128M tests/StatisticsMemoryTest.php --stream
      - name: Composer and deterministic tests
        run: |
          composer install --no-interaction --no-progress
          composer test
      - name: Migrate and create two founders
        run: |
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation < database/migrations/001_initial.sql
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation < database/migrations/002_aging_genealogy.sql
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation < database/migrations/003_reproduction.sql
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation < database/migrations/004_partnerships.sql
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation < database/migrations/005_relationship_settings.sql
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation < database/migrations/006_mortality.sql
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation < database/migrations/007_family_search.sql
          php bin/create-world.php "Genesis World" 1337
          php tests/CreateWorldIntegrationTest.php
          php tests/WorldHistoryIntegrationTest.php
          php tests/CsvExportIntegrationTest.php
          php tests/StatisticsIntegrationTest.php
          php bin/family-tree.php 1
          php tests/FamilyTreeIntegrationTest.php
          php tests/FamilyTreeViewIntegrationTest.php
          php tests/MortalityIntegrationTest.php
          php tests/MortalityPartnershipIntegrationTest.php
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM world_relationship_settings WHERE allow_parent_child_partnerships=1')" = 0
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM people WHERE world_id=1')" = 2
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM people WHERE world_id=1 AND mother_id IS NULL AND father_id IS NULL')" = 2
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM world_events WHERE event_type="founder"')" = 2
      - name: Verify founder ages and advance 1,000 days
        run: |
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM people WHERE initial_age_days=7300')" = 2
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation -e "UPDATE worlds SET status='running' WHERE id=1"
          php bin/simulate.php 1 1000
          php bin/family-tree.php 1 | grep 'Adam.*age 22 years'
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT current_day FROM worlds WHERE id=1')" = 1000
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM people WHERE mother_id IS NOT NULL AND father_id IS NOT NULL')" -gt 0
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM people WHERE mother_id IS NULL AND father_id IS NULL')" = 2
      - name: Verify multiple generations
        run: |
          php bin/simulate.php 1 9000
          php bin/population-report.php 1
          mariadb -h 127.0.0.1 -u fg_app -ptest-password first_generation -e "SELECT 'partnerships' metric,COUNT(*) total FROM partnerships UNION ALL SELECT 'people',COUNT(*) FROM people UNION ALL SELECT 'children',COUNT(*) FROM people WHERE mother_id IS NOT NULL UNION ALL SELECT 'grandchildren',COUNT(*) FROM people WHERE mother_id IN (SELECT id FROM people WHERE mother_id IS NOT NULL) UNION ALL SELECT 'female_children',COUNT(*) FROM people WHERE sex='female' AND mother_id IS NOT NULL UNION ALL SELECT 'male_children',COUNT(*) FROM people WHERE sex='male' AND mother_id IS NOT NULL"
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM partnerships WHERE world_id=1')" -gt 1
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM people WHERE mother_id IN (SELECT id FROM people WHERE mother_id IS NOT NULL)')" -gt 0
          test "$(mariadb -N -h 127.0.0.1 -u fg_app -ptest-password first_generation -e 'SELECT COUNT(*) FROM people WHERE mother_id IS NULL AND father_id IS NULL')" = 2
